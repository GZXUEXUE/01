<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RECALL // SYSTEM</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #000;
            color: #0f0;
            font-family: 'Courier New', Courier, monospace;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        #canvas {
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
            opacity: 0.3;
        }

        #terminal {
            position: relative;
            z-index: 10;
            background: rgba(0, 20, 0, 0.8);
            border: 2px solid #0f0;
            padding: 40px;
            max-width: 600px;
            width: 80%;
            box-shadow: 0 0 20px #0f0;
            text-align: center;
        }

        h1 {
            margin-top: 0;
            text-shadow: 0 0 10px #0f0;
            letter-spacing: 5px;
        }

        .message {
            font-size: 1.2rem;
            margin-bottom: 30px;
            line-height: 1.5;
        }

        .highlight {
            color: #fff;
            font-weight: bold;
            text-decoration: underline;
        }

        input[type="text"] {
            background: #000;
            border: 1px solid #0f0;
            color: #0f0;
            padding: 10px;
            width: 70%;
            font-family: inherit;
            font-size: 1rem;
            outline: none;
        }

        button {
            background: #0f0;
            color: #000;
            border: none;
            padding: 10px 20px;
            font-weight: bold;
            cursor: pointer;
            font-family: inherit;
            font-size: 1rem;
            transition: 0.3s;
        }

        button:hover {
            background: #fff;
            box-shadow: 0 0 15px #fff;
        }

        #output {
            margin-top: 20px;
            min-height: 20px;
            color: #ff0;
            white-space: pre-line; /* 支持换行 */
        }

        .hidden-problem {
            display: none;
            margin-top: 20px;
            text-align: left;
            border-top: 1px dashed #0f0;
            padding-top: 20px;
        }
    </style>
</head>
<body>

    <canvas id="canvas"></canvas>

    <div id="terminal">
        <h1>! FAILED</h1>
        <div class="message">
            Data Error<br>
           Failed to load 2026_04_01.mem<br>
            <span id="scramble-text">正整数...</span>
        </div>
        
        <div id="input-area">
            <input type="text" id="answer" placeholder="满足条件的序列...用空格分隔...">
            <button onclick="checkAnswer()">尝试</button>
        </div>

        <div id="output"></div>

        <div id="problem-reveal" class="hidden-problem">
            <h3>>> 记忆重构成功 <<</h3>
            <p><strong>题目描述：</strong></p>
            <p>给定一个整数 n，请构造一个长度为 n 的序列 a，满足：</p>
            <ul>
                <li>序列中的每个数都是小于10000000的正整数。</li>
                <li>序列中任意两个相邻的数互质。</li>
                <li>序列中所有数的和为偶数。</li>
            </ul>
            <p>如果无解，输出 -1；否则输出任意一种方案。</p>
        </div>
    </div>

    <script>
        // Matrix Rain Effect
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');

        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        const letters = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789@#$%^&*';
        const fontSize = 16;
        const columns = canvas.width / fontSize;
        const drops = [];

        for (let i = 0; i < columns; i++) {
            drops[i] = 1;
        }

        function drawMatrix() {
            ctx.fillStyle = 'rgba(0, 0, 0, 0.05)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.fillStyle = '#0f0';
            ctx.font = fontSize + 'px monospace';

            for (let i = 0; i < drops.length; i++) {
                const text = letters.charAt(Math.floor(Math.random() * letters.length));
                ctx.fillText(text, i * fontSize, drops[i] * fontSize);

                if (drops[i] * fontSize > canvas.height && Math.random() > 0.975) {
                    drops[i] = 0;
                }
                drops[i]++;
            }
        }

        setInterval(drawMatrix, 33);

        // Decryption Logic
        const scrambleText = document.getElementById('scramble-text');
        const words = ["正整数...", "和为偶数...", "相邻互质...", "构造一个序列..."];
        let wordIndex = 0;

        setInterval(() => {
            scrambleText.innerText = words[wordIndex];
            scrambleText.style.color = wordIndex === 2 ? "#ff0" : "#0f0"; // Highlight the key hint
            wordIndex = (wordIndex + 1) % words.length;
        }, 2000);

        // --- 核心修改部分开始 ---

        // 计算最大公约数 (GCD) 的函数
        function gcd(a, b) {
            return b === 0 ? a : gcd(b, a % b);
        }

        // 辅助函数：延时
        const sleep = (ms) => new Promise(resolve => setTimeout(resolve, ms));

        // 修改为异步函数以支持停顿效果
        async function checkAnswer() {
            const input = document.getElementById('answer').value.trim();
            const output = document.getElementById('output');
            const problem = document.getElementById('problem-reveal');

            if (!input) {
                output.innerHTML = ">>> 空的...想不起来...";
                output.style.color = "red";
                return;
            }

            // 1. 解析输入：按空格分割，转为数字
            const parts = input.split(/\s+/);
            const sequence = parts.map(Number);

            // 检查是否包含非数字字符
            if (sequence.some(isNaN)) {
                output.innerHTML = ">>> 不是数字吗...想不起来...或许全是数字吧...";
                output.style.color = "red";
                return;
            }

            // 2. 验证长度至少为 3
            if (sequence.length < 3) {
                output.innerHTML = ">>> 长度不足...至少需要3个...";
                output.style.color = "red";
                return;
            }

            // 3. 验证条件 A: 必须都是正整数
            if (sequence.some(num => num <= 0 || !Number.isInteger(num))) {
                output.innerHTML = ">>> 是正整数...";
                output.style.color = "red";
                return;
            }

            // 4. 验证条件 B: 相邻互质
            for (let i = 0; i < sequence.length - 1; i++) {
                if (gcd(sequence[i], sequence[i+1]) !== 1) {
                    output.innerHTML = `>>> ${sequence[i]} 和 ${sequence[i+1]} ...似乎不互质...`;
                    output.style.color = "red";
                    return;
                }
            }

            // 5. 验证条件 C: 和为偶数
            const sum = sequence.reduce((a, b) => a + b, 0);
            if (sum % 2 !== 0) {
                output.innerHTML = ">>> 和...偶数...追忆...";
                output.style.color = "red";
                return;
            }

            // 6. 验证通过 - 演出效果
            output.style.color = "#0f0";
            output.innerHTML = "啊...";
            await sleep(1000); // 停顿 1 秒
            output.innerHTML += "想起来了！";
            
            // 显示题面
            problem.style.display = "block";
        }
        
        // --- 核心修改部分结束 ---
    </script>
</body>
</html>
